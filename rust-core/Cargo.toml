[package]
name = "anonero-rust-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "anonero_rust_core"
crate-type = ["cdylib"]

[dependencies]
# Use the upstream Rust Monero seed parser for the first migrated wallet primitive.
monero-seed = { git = "https://github.com/monero-oxide/monero-wallet-util", package = "monero-seed" }
jni = "0.21.1"
zeroize = { version = "1", features = ["std"] }
