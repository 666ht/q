[package]
name = "anonero-rust-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "anonero_rust_core"
crate-type = ["cdylib"]

[dependencies]
# Use Monfluo's cross-platform Rust wallet core, not the upstream GitHub workspace.
monfluo-oxide = { git = "https://codeberg.org/Monfluo/monero-oxide", branch = "main" }
