name: Dispatch APK rebuild

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.id == 37097273865 && github.event.workflow_run.run_attempt >= 2
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch fresh APK build on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/actions/workflows/build-apk-xmr.yml/dispatches" -f ref=main
