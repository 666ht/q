name: Build APK from upstream instructions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout q with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Build native libraries
        working-directory: external-libs
        run: make android NPROC=2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleAnonRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anon-release-apk
          path: app/build/outputs/apk/anon/release/*.apk
          if-no-files-found: error
