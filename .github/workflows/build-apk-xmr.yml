name: Build APK from upstream instructions

on:
  push:
    branches: ["build/xmr-cache-apk"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout q with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Read XMR revision
        id: xmr
        run: echo "sha=$(git -C external-libs/monero rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: anonero-native-${{ runner.os }}-${{ steps.xmr.outputs.sha }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Build native libraries on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: external-libs
        run: make android NPROC=2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleAnonRelease
