name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.caching=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout q with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin XMR restore-height fix
        working-directory: external-libs/monero
        run: |
          git fetch --depth=1 origin c6f830f6ef0e838b75fa2c35494452056c878c89
          git checkout c6f830f6ef0e838b75fa2c35494452056c878c89

      - name: Read XMR revision
        id: xmr
        run: echo "sha=$(git -C external-libs/monero rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
          key: anonero-native-${{ runner.os }}-${{ steps.xmr.outputs.sha }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Build native libraries on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: external-libs
        run: make android NPROC=2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            $ANDROID_SDK_ROOT/platforms/android-35
            $ANDROID_SDK_ROOT/build-tools/36.0.0
            $ANDROID_SDK_ROOT/ndk/29.0.13599879
            $ANDROID_SDK_ROOT/cmake/3.22.1
          key: android-sdk-35-build-tools-36.0.0-ndk-29.0.13599879-cmake-3.22.1-v2-${{ runner.os }}

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools" "ndk;29.0.13599879" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-gradle caches the Gradle distribution, dependency cache, and build cache.
      # Do not cache app/build directly: source changes make that cache ineffective and can
      # restore stale intermediates that Gradle must invalidate anyway.

      - name: Build APK
        run: ./gradlew --no-daemon assembleAnonRelease -PbuildNumber="${{ github.run_number }}"

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: anonero-apk-build-${{ github.run_number }}
          path: app/build/outputs/apk/anon/release/*.apk
          if-no-files-found: error
          retention-days: 7
# Keep the Monero submodule pinned to the tested const-correct revision.
